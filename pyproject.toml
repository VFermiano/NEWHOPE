[project]
name = "newhope-pipeline"
version = "0.1.0"
description = "NEWHOPE: an OOP pipeline for NEWFIRM reduction, astrometry, and photometry"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "astropy",
    "photutils",
    "scipy",
    "pyyaml",
    "pydantic>=2",
    "typer",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "ruff"]

[project.scripts]
newhope-pipeline = "newhope_pipeline.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

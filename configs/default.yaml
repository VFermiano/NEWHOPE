raw_dir: data/raw
output_dir: data/processed
manifest_path: data/pipeline_state.json
n_workers: 4

reduction:
  dark_dir: data/
  flat_dir: data/
  filters: [JX, HX, KXs]

astrometry:
  scamp_config_path: configs/scamp/default.scamp
  timeout_seconds: 120

photometry:
  vvv_catalog_path: data/calib/vvv_catalog.fits
  fwhm_pixels: 4.0

# Optional -- only needed for `newhope-pipeline download` / `run --download`.
# Downloads land in raw_dir above.
acquisition:
  instrument: newfirm
  telescope: ct4m
#  proposal: 2025A-599150
#  night: "2025-05-13"
  proctype: raw
  limit: 5000
  skip_calibrations: false


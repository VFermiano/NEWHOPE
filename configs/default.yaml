# Parent directory for all runs. Override with --base-dir on the CLI.
# Each proposal+night gets its own folder inside it:
#   <base_dir>/<proposal>_<night>/{raw/, processed/, pipeline_state.json}
base_dir: data
n_workers: 4
batch_size: 1  # maximum raw frames scheduled at once; increase only if memory allows

reduction:
  # dark_dir / flat_dir default to the run's raw/ directory; uncomment to override.
  # dark_dir: data/calib/darks
  # flat_dir: data/calib/flats
  filters: [JX, HX, KXs]
  sky:
    mode: scale            # scale = multiplicative, offset = additive
    n_neighbors: 10        # nearest-in-time exposures per sky
    min_neighbors: 4       # fewer than this -> the frame fails
    max_time_gap_s: 1800
    group_keys: [OBJECT]   # header keywords that must match (besides the filter)
    iterations: 2          # object-masked passes after the initial unmasked median

astrometry:
  sextractor_executable: sex
  sextractor_config_path: configs/sextractor/default.sex
  sextractor_parameters_path: configs/sextractor/default.param
  sextractor_filter_path: configs/sextractor/default.conv
  detection_threshold_sigma: 5.0
  detection_minimum_area: 5
  scamp_executable: scamp
  scamp_config_path: configs/scamp/default.scamp
  reference_catalog: GAIA-EDR3
  # For reference_catalog: FILE, set the local SCAMP reference catalog here.
  # reference_catalog_path: data/calib/astrometric_catalog.fits
  scamp_parameters: {}
  timeout_seconds: 120
  keep_intermediates: true
  reuse_intermediates: true

stacking:
  swarp_executable: swarp
  swarp_config_path: configs/swarp/default.swarp
  # null uses SWarp's median input pixel scale; set an arcsec/pixel value to override.
  output_pixel_scale_arcsec: null
  projection: TAN
  resampling_method: LANCZOS3
  combination_method: MEDIAN
  minimum_exposures: 2
  timeout_seconds: 600
  keep_intermediates: false
  reuse_intermediates: true

photometry:
  vvv_catalog_path: data/calib/vvv_catalog.fits
  fwhm_pixels: 4.0

# Optional -- only needed for `newhope-pipeline download` / `run --download`.
# Downloads land in <base_dir>/<proposal>_<night>/raw/.
acquisition:
  instrument: newfirm
  telescope: ct4m
#  proposal: 2025A-599150
#  night: "2025-05-13"
  proctype: raw
  limit: 5000
  skip_calibrations: false

